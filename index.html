<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --paper:#F4F5FA;
    --paper-raised:#FFFFFF;
    --ink:#14161F;
    --ink-soft:#6B7280;
    --ink-faint:#9AA1AE;
    --ledger-line:#E7E8EF;
    --verde:#16A34A;
    --verde-bg:#E3F6EA;
    --vinho:#DC3D6B;
    --vinho-bg:#FCE8EF;
    --ouro:#C1810F;
    --ouro-bg:#FBF0DA;
    --azul:#3D5AFE;
    --azul-bg:#E8EBFF;
    --roxo:#7C5CFF;
    --roxo-bg:#EEEAFF;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 1px 2px rgba(20,22,31,.04), 0 10px 28px rgba(20,22,31,.06);
    --shadow-lg:0 24px 60px rgba(20,22,31,.20);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;margin:0;color:var(--ink);letter-spacing:-.01em;}
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  input,select,textarea,button{font-family:inherit;font-size:14px;}
  a{color:var(--azul);}
  ::selection{background:var(--azul-bg);}
  :focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:4px;}
  button{transition:background-color .15s ease, border-color .15s ease, transform .15s ease, box-shadow .15s ease;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  #sidebar{
    width:232px;flex-shrink:0;
    background:var(--paper-raised);
    border-right:1px solid var(--ledger-line);
    padding:22px 0;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:0 20px 22px;margin-bottom:12px;border-bottom:1px solid var(--ledger-line);}
  .brand-mark{
    width:36px;height:36px;border-radius:11px;flex-shrink:0;
    background:linear-gradient(155deg,var(--azul),#7C5CFF);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;letter-spacing:-.02em;
    box-shadow:0 6px 14px rgba(61,90,254,.28);
  }
  .brand h1{font-size:16.5px;line-height:1.2;}
  .brand p{margin:3px 0 0;font-size:11.5px;color:var(--ink-soft);}
  .tab-item{
    display:flex;align-items:center;gap:11px;
    margin:2px 12px;padding:9px 13px;cursor:pointer;
    border-radius:12px;color:var(--ink-soft);font-weight:500;font-size:14px;
  }
  .tab-item:hover{background:var(--paper);color:var(--ink);}
  .tab-item.active{
    background:var(--tab-accent-bg, var(--azul-bg));
    color:var(--tab-accent, var(--azul));
    font-weight:600;
  }
  .tab-icon{display:flex;flex-shrink:0;width:19px;height:19px;}
  .tab-icon svg{width:100%;height:100%;}
  .tab-label{white-space:nowrap;}

  /* Topbar */
  #content-area{flex:1;min-width:0;display:flex;flex-direction:column;}
  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 32px;border-bottom:1px solid var(--ledger-line);
    background:var(--paper-raised);position:sticky;top:0;z-index:5;flex-wrap:wrap;gap:10px;
  }
  .month-nav{
    display:flex;align-items:center;gap:4px;background:var(--paper);
    border:1px solid var(--ledger-line);border-radius:999px;padding:4px;
  }
  .month-nav button{
    width:28px;height:28px;border-radius:50%;border:none;
    background:transparent;color:var(--ink-soft);cursor:pointer;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .month-nav button:hover{background:var(--paper-raised);color:var(--ink);box-shadow:var(--shadow);}
  .month-label{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;min-width:150px;text-align:center;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  #save-indicator{font-size:12px;color:var(--ink-faint);}
  .btn-ghost{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--ledger-line);background:var(--paper-raised);color:var(--ink-soft);
    padding:8px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500;
  }
  .btn-ghost:hover{background:var(--paper);color:var(--ink);border-color:#D9DBE4;}

  #main-content{padding:26px 32px 60px;max-width:1200px;}
  #main-content.wide{max-width:none;padding-left:20px;padding-right:20px;}
  #main-content.wide .sheet-scroll{max-width:100%;}

  /* Cards */
  .cards-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;align-items:stretch;}
  .cards-row-3{grid-template-columns:repeat(3,1fr);}
  .stat-card{
    display:flex;align-items:center;gap:14px;min-height:80px;min-width:0;
    background:var(--paper-raised);border:1px solid var(--ledger-line);border-radius:var(--radius);
    padding:16px 17px;box-shadow:var(--shadow);
  }
  .stat-icon{
    width:42px;height:42px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent-bg,var(--azul-bg));color:var(--accent,var(--azul));
  }
  .stat-icon svg{width:20px;height:20px;}
  .stat-body{min-width:0;flex:1;}
  .stat-card .label{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;font-weight:600;line-height:1.3;}
  .stat-card .value{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;margin-top:3px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .panel{
    background:var(--paper-raised);border:1px solid var(--ledger-line);border-radius:var(--radius);
    padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .panel-header h2{font-size:16px;}
  .panel-header .hint{font-size:12.5px;color:var(--ink-soft);}

  .charts-row{display:grid;grid-template-columns:40fr 60fr;gap:16px;margin-bottom:20px;}
  .chart-box{position:relative;height:280px;}
  .donut-selected{font-size:13.5px;color:var(--ink-soft);margin:0 0 10px;min-height:19px;}
  .donut-selected strong{color:var(--ink);font-family:'IBM Plex Mono',monospace;}

  /* Section groups (orçamento) */
  .section-title{
    font-family:'Inter',sans-serif;font-weight:700;font-size:11.5px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--ink-faint);
    margin:22px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--ledger-line);
  }
  .section-title:first-child{margin-top:0;}
  .group-name-row{display:flex;align-items:center;gap:8px;margin:16px 0 4px;}
  .group-name-row input{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;border:none;background:transparent;color:var(--ink);
    border-radius:6px;padding:3px 4px;flex:1;
  }
  .group-name-row input:hover,.group-name-row input:focus{background:var(--paper);}

  .row{
    display:grid;grid-template-columns:1fr 130px 30px;gap:10px;align-items:center;
    padding:7px 8px;border-radius:9px;
  }
  .row:hover{background:var(--paper);}
  .row input.row-label{
    border:none;background:transparent;padding:4px 3px;color:var(--ink);border-radius:6px;
  }
  .row input.row-label:hover,.row input.row-label:focus{background:var(--paper-raised);box-shadow:0 0 0 1px var(--ledger-line);}
  .row input.row-value{
    border:1px solid var(--ledger-line);border-radius:8px;padding:6px 9px;text-align:right;
    font-family:'IBM Plex Mono',monospace;background:var(--paper);width:100%;
  }
  .row input.row-value:focus{border-color:var(--azul);background:var(--paper-raised);}
  .row-del{
    border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:15px;width:26px;height:26px;border-radius:7px;
  }
  .row-del:hover{background:var(--vinho-bg);color:var(--vinho);}

  .row-variavel{grid-template-columns:1fr 120px 90px 90px 30px;}
  .var-progress{background:var(--paper);border:1px solid var(--ledger-line);border-radius:20px;height:8px;overflow:hidden;}
  .var-bar{height:100%;background:var(--verde);border-radius:20px;}
  .var-bar.over{background:var(--vinho);}
  .row-variavel .num{font-size:13px;text-align:right;}
  .row-variavel .num.muted{color:var(--ink-soft);}

  .add-link{
    display:inline-flex;align-items:center;gap:6px;
    border:1px dashed var(--ledger-line);background:none;color:var(--azul);cursor:pointer;
    border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;margin-top:8px;
  }
  .add-link:hover{background:var(--azul-bg);border-color:var(--azul);border-style:solid;}

  .totals-row{
    display:flex;justify-content:space-between;align-items:center;padding:12px 8px 0;margin-top:8px;
    border-top:1px solid var(--ledger-line);font-weight:600;
  }
  .totals-row .num{font-size:15px;}

  .saldo-panel{background:linear-gradient(180deg, var(--paper-raised), var(--paper-raised));}
  .saldo-panel .value{font-size:26px;}

  /* Forms */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end;}
  .field label{display:block;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;font-weight:600;margin-bottom:5px;}
  .field input,.field select{
    width:100%;border:1px solid var(--ledger-line);border-radius:10px;padding:9px 10px;background:var(--paper);color:var(--ink);
  }
  .field input:focus,.field select:focus{border-color:var(--azul);background:var(--paper-raised);}
  .btn-primary{
    background:var(--verde);color:#fff;border:none;border-radius:10px;padding:9px 18px;cursor:pointer;font-weight:600;
    height:39px;box-shadow:0 2px 10px rgba(22,163,74,.25);
  }
  .btn-primary:hover{background:#128A3E;transform:translateY(-1px);box-shadow:0 6px 16px rgba(22,163,74,.3);}
  .form-error{color:var(--vinho);font-size:12.5px;margin-top:10px;}

  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);font-weight:700;
    border-bottom:1px solid var(--ledger-line);padding:8px;
  }
  tbody td{padding:9px 8px;border-bottom:1px solid var(--ledger-line);vertical-align:middle;}
  tbody tr:hover{background:var(--paper);}
  td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .badge{
    display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;
  }
  .badge.pago{background:var(--verde-bg);color:var(--verde);}
  .badge.pagando{background:var(--ouro-bg);color:var(--ouro);}
  .icon-btn{border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:14px;padding:5px 8px;border-radius:8px;}
  .icon-btn:hover{background:var(--vinho-bg);color:var(--vinho);}
  .mini-btn{border:1px solid var(--ledger-line);background:var(--paper);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:11.5px;font-weight:500;}
  .mini-btn:hover{background:var(--verde-bg);border-color:var(--verde);color:var(--verde);}

  .empty-state{padding:30px 10px;text-align:center;color:var(--ink-faint);font-size:13.5px;}

  .type-bars{display:flex;flex-direction:column;gap:11px;margin-top:6px;}
  .type-bar-row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:13px;}
  .type-bar-track{background:var(--paper);border:1px solid var(--ledger-line);border-radius:20px;height:9px;overflow:hidden;}
  .type-bar-fill{height:100%;background:var(--ouro);border-radius:20px;}

  /* Confirmation modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,17,26,.5);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
  }
  .modal-card{
    background:var(--paper-raised);border:1px solid var(--ledger-line);border-radius:20px;
    padding:26px 26px 22px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);
  }
  .modal-card h3{font-size:17px;margin-bottom:10px;}
  .modal-message{font-size:14px;line-height:1.55;color:var(--ink-soft);margin:0 0 22px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}
  .btn-danger{background:var(--vinho);color:#fff;border:none;border-radius:10px;padding:9px 17px;cursor:pointer;font-weight:600;}
  .btn-danger:hover{background:#B92E58;}

  /* Cartão sub-tabs */
  .subtab-switch{display:flex;gap:6px;margin-bottom:18px;background:var(--paper);border:1px solid var(--ledger-line);border-radius:999px;padding:4px;width:max-content;}
  .subtab-btn{
    display:inline-flex;align-items:center;gap:7px;
    border:none;background:none;color:var(--ink-soft);cursor:pointer;
    padding:7px 15px;border-radius:999px;font-size:13px;font-weight:500;
  }
  .subtab-btn:hover{color:var(--ink);}
  .subtab-btn.active{background:var(--paper-raised);color:var(--ink);box-shadow:var(--shadow);font-weight:600;}

  /* Planilha "Clássico" — visual de planilha tradicional (linhas de grade, zebra, cabeçalho sólido) */
  .planilha-classic .panel{border-radius:6px;box-shadow:none;border-color:#C7CBD3;}
  .planilha-classic .sheet-scroll{border-radius:4px;border-color:#C7CBD3;}
  table.sheet-classic{border-collapse:collapse;font-size:12px;}
  .sheet-classic td.num, .sheet-classic th.num{font-size:13px;}
  .sheet-classic thead th{
    background:#EEF0F4;color:var(--ink);border:1px solid #C7CBD3;
    font-size:10.5px;padding:7px 8px;
  }
  .sheet-classic tbody td, .sheet-classic tfoot td{border:1px solid #DBDEE6;padding:5px 7px;}
  .sheet-classic tbody tr:nth-child(even) td{background:#F7F8FB;}
  .sheet-classic tbody tr:hover td{background:#EEF2FF;}
  .sheet-classic .sheet-sticky{background:var(--paper-raised);box-shadow:1px 0 0 #C7CBD3;}
  .sheet-classic tbody tr:nth-child(even) .sheet-sticky{background:#F7F8FB;}
  .sheet-classic tbody tr:hover .sheet-sticky{background:#EEF2FF;}
  .sheet-classic .sheet-section-row td{background:#DEE2EC;color:var(--ink);border:1px solid #C7CBD3;border-top:2px solid #9AA1B2;font-size:11px;}
  .sheet-classic .sheet-group-row td{background:#EBEDF2;color:var(--ink-soft);border:1px solid #DBDEE6;}
  .sheet-classic .sheet-total-row td{background:#E8EAF0;border:1px solid #C7CBD3;border-top:2px solid #9AA1B2;}
  .sheet-classic .sheet-pct-row td{background:#FAFAFC;border:1px solid #E4E6EC;}
  .sheet-classic .sheet-input{border-radius:2px;border-color:transparent;}
  .sheet-classic .sheet-input:hover{background:#E4E9FB;}
  .sheet-classic .sheet-input:focus{border-color:var(--azul);box-shadow:inset 0 0 0 1px var(--azul);background:#fff;}
  .sheet-classic .sheet-label-input{border-radius:2px;}

  /* Planilha replica — editable cells & special rows */
  .sheet-label-input{
    border:none;background:transparent;font:inherit;color:inherit;width:100%;
    padding:3px 4px;border-radius:5px;display:block;white-space:normal;word-break:break-word;line-height:1.35;
  }
  .sheet-label-input:hover,.sheet-label-input:focus{background:var(--paper);outline:none;}
  .sheet-input{
    width:92px;border:1px solid transparent;background:transparent;text-align:right;
    font-family:'IBM Plex Mono',monospace;font-size:13px;padding:5px 6px;border-radius:6px;color:var(--ink);
    -moz-appearance:textfield;
  }
  .sheet-input::-webkit-outer-spin-button,.sheet-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .sheet-input::placeholder{color:var(--ink-faint);opacity:1;}
  .sheet-input:hover{background:var(--paper);}
  .sheet-input:focus{background:var(--paper-raised);border-color:var(--azul);box-shadow:0 0 0 2px var(--azul-bg);outline:none;}
  .sheet-section-row td{background:var(--ink);color:#fff;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:0;}
  .sheet-group-row td{background:var(--paper);color:var(--ink-soft);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:0;}
  .sheet-band-label{
    position:sticky;left:0;display:inline-block;padding:9px 10px;
    -webkit-transform:translateZ(0);transform:translateZ(0);
  }
  .sheet-group-row .sheet-band-label{padding:6px 10px;}
  .sheet-total-row td{background:var(--paper);font-weight:700;border-top:1px solid var(--ink-faint);font-size:12px;}
  .sheet-total-row td.num{font-size:13px;}
  .sheet-pct-row td{color:var(--ink-faint);font-size:10.5px;font-style:italic;padding-top:1px;padding-bottom:9px;border-bottom:1px solid var(--ledger-line);}
  .sheet-pct-row td.num{font-size:11.5px;}
  .sheet-spacer-row td{height:16px;border:none !important;padding:0;background:transparent;}
  .sheet-note-row td{background:var(--paper-raised);color:var(--ink-soft);font-size:11px;font-style:italic;padding:2px 10px 10px;border-bottom:1px solid var(--ledger-line);}
  .sheet-saldo-row td{font-weight:700;border-bottom:1px solid var(--ledger-line);}
  .sheet-saldo-even td{background:#FFFFFF !important;}
  .sheet-saldo-odd td{background:#EEF1F8 !important;}
  .sheet-saldo-final td{background:#D7DEF3 !important;border-top:2px solid #9AA6C4;font-weight:800;}
  .sheet-saldo-even .sheet-sticky{background:#FFFFFF !important;}
  .sheet-saldo-odd .sheet-sticky{background:#EEF1F8 !important;}
  .sheet-saldo-final .sheet-sticky{background:#D7DEF3 !important;}
  .sheet-table tbody tr.sheet-saldo-row:hover td{background:#E2E7F6 !important;}
  .sheet-table tbody tr.sheet-saldo-row:hover .sheet-sticky{background:#E2E7F6 !important;}
  .sheet-nav-link{
    display:inline-flex;align-items:center;gap:4px;margin-top:3px;
    border:none;background:none;color:var(--roxo);cursor:pointer;font-size:10.5px;font-weight:600;padding:0;
  }
  .sheet-nav-link:hover{text-decoration:underline;}
  .sheet-annual-total{font-weight:700 !important;font-size:14px;color:var(--ink);}
  .sheet-cat-toggle{cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;}
  .sheet-cat-toggle:hover{color:var(--azul);}
  .sheet-cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  tr.sheet-row-off{opacity:.45;}
  tr.sheet-row-off .sheet-cat-toggle{text-decoration:line-through;}

  /* Spreadsheet-style overview table */
  .sheet-scroll{overflow:auto;max-height:calc(100vh - 190px);-webkit-overflow-scrolling:touch;border:1px solid var(--ledger-line);border-radius:var(--radius-sm);}
  table.sheet-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:900px;table-layout:auto;}
  .sheet-table td.num, .sheet-table th.num{font-size:13.5px;}
  .sheet-table thead th{
    position:sticky;top:0;background:var(--paper);color:var(--ink-soft);
    font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;
    padding:10px 10px;border-bottom:1px solid var(--ledger-line);white-space:nowrap;
    z-index:3;-webkit-transform:translateZ(0);transform:translateZ(0);
    box-shadow:0 1px 0 var(--ledger-line);
  }
  .sheet-table thead th.num{min-width:92px;text-align:center;}
  .sheet-table thead th:hover{color:var(--azul);}
  .sheet-table tbody td, .sheet-table tfoot td{
    padding:9px 10px;border-bottom:1px solid var(--ledger-line);
  }
  .sheet-table tbody td.num, .sheet-table tfoot td.num{white-space:nowrap;}
  .sheet-table tbody tr:hover{background:var(--paper);}
  .sheet-table tfoot td{font-weight:700;background:var(--paper);border-top:1px solid var(--ink-faint);border-bottom:none;}
  .sheet-sticky{
    position:sticky;left:0;background:var(--paper-raised);z-index:2;
    text-align:left;font-weight:500;box-shadow:1px 0 0 var(--ledger-line);
    min-width:210px;max-width:300px;white-space:normal;word-break:break-word;
    -webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform;
  }
  .sheet-table tbody tr:hover .sheet-sticky{background:var(--paper);}
  .sheet-table tfoot .sheet-sticky{background:var(--paper);}
  .sheet-current{background:var(--azul-bg);}

  /* Cartão category filter chips */
  .filter-chips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 16px;}
  .chip{
    border:1px solid var(--ledger-line);background:var(--paper-raised);color:var(--ink-soft);
    border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:500;cursor:pointer;
  }
  .chip:hover{border-color:var(--azul);color:var(--ink);}
  .chip.active{background:var(--azul-bg);border-color:var(--azul);color:var(--azul);font-weight:600;}
  .chip.chip-todas{font-weight:600;}
  .chip.chip-todas.active{background:var(--verde-bg);border-color:var(--verde);color:var(--verde);}

  .print-only-header{display:none;}

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  /* Responsive */
  @media (max-width:860px){
    #app{flex-direction:column;}
    #sidebar{width:100%;height:auto;position:static;padding:12px 0;display:flex;overflow-x:auto;}
    .brand{display:none;}
    .tab-item{flex-direction:column;gap:5px;padding:9px 15px;margin:0 4px;white-space:nowrap;}
    #main-content{padding:16px 12px 40px;}
    .panel{padding:16px 14px;}
    .cards-row{grid-template-columns:repeat(2,1fr);}
    .cards-row-3{grid-template-columns:1fr;}
    .charts-row{grid-template-columns:1fr;}
    #topbar{padding:12px 16px;}
    .row-variavel{grid-template-columns:1fr 60px 66px 60px 26px;gap:6px;}
    .row-variavel .num{font-size:11px;}
    .row-recuperacao{grid-template-columns:1fr 1fr !important;row-gap:8px;}
    .row-recuperacao button.row-del{grid-column:1/-1;justify-self:end;}
    .form-grid{grid-template-columns:1fr 1fr;}
    table.sheet-table{min-width:700px;}
    .field input, .field select, .row input.row-value, .row-variavel input.row-value{font-size:16px;}
  }
  /* Impressão / Exportar PDF (aba Cartão) — mostra só a janela de gastos do mês */
  @media print{
    body{background:#fff;}
    #sidebar, #topbar{display:none !important;}
    #app, #content-area{display:block !important;}
    #main-content{padding:0 !important;max-width:100% !important;}
    #main-content > *{display:none !important;}
    #main-content #print-area{display:block !important;}
    .no-print{display:none !important;}
    #print-area{box-shadow:none !important;border:none !important;padding:0 !important;margin-bottom:0 !important;}
    .print-only-header{display:block !important;font-size:12px;color:#444;margin:0 0 12px;}
    table{font-size:12px;}
    thead th{border-bottom:1px solid #999;}
    tbody td{border-bottom:1px solid #ddd;}
  }
</style>
</head>

function sheetFmt(v){
  const n = Number(v)||0;
  if(n===0) return '';
  return n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
/** Converte texto no padrão brasileiro (ponto de milhar, vírgula decimal) de volta para número */
function sheetParse(str){
  if(str===null || str===undefined || str==='') return 0;
  const cleaned = String(str).trim().replace(/\./g,'').replace(',', '.').replace(/[^\d.-]/g,'');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

async function loadKey(key, fallback){

  try{
    const { data, error } = await sb.from('app_data').select('value').eq('key', key).maybeSingle();

let saveTimers = {};
let pendingSaves = 0;
function setSavingIndicator(status, detail){
  const el = document.getElementById('save-indicator');
  if(!el) return;
  if(status==='saving') el.textContent = 'Salvando…';
  else if(status==='error'){ el.textContent = 'Erro ao salvar' + (detail ? ': '+detail : ' — veja o console'); el.title = detail||''; }
  else el.textContent = 'Tudo salvo ✓';
}
function scheduleSave(key, dataGetter){
  clearTimeout(saveTimers[key]);
  pendingSaves++;
  setSavingIndicator('saving');
  saveTimers[key] = setTimeout(async ()=>{
    try{
      if(!sb) throw new Error('Supabase não configurado');
      const { error } = await sb.from('app_data').upsert({ key, value: dataGetter(), updated_at: new Date().toISOString() });
      if(error) throw error;
    }catch(e){
      const detail = e && (e.message || e.error_description || e.hint || e.details) || JSON.stringify(e);
      console.error('Erro ao salvar', key, '→', detail, e);
      setSavingIndicator('error', detail); return;
    }finally{
      pendingSaves = Math.max(0, pendingSaves-1);
    }
    if(pendingSaves===0) setSavingIndicator('saved');
  }, 500);
}

/** Corrige orçamentos salvos ANTES de recursos novos serem adicionados (ex: grupo "Outros",
 * separação fixaGroups/variaveisGroups), sem apagar nada que o usuário já editou. */
function migrateBudget(){
  const p = state.planilha;
  if(p && p.cartao && p.cartao[1] && /gastos m.e/i.test(p.cartao[1].label||'')){
    p.cartao[1].label = 'Recuperações de despesa';
    savePlanilha();
  }
  const b = state.budget;
  let changed = false;
  if(!b.recuperacoes){
    if(b.franquiaMae!==undefined){
      // dado antigo (franquia única fixa em "Mãe") — converte pra lista
      b.recuperacoes = [{id:uid(), nome:"Mãe (reembolsável)", categoria:"Mãe (reembolsável)", franquia:b.franquiaMae}];
      delete b.franquiaMae;
    } else {
      b.recuperacoes = JSON.parse(JSON.stringify(SEED_DATA.budget.recuperacoes));
    }
    changed = true;
  }
  if(!b.variaveisGroups){ b.variaveisGroups = JSON.parse(JSON.stringify(SEED_DATA.budget.variaveisGroups)); changed = true; }
  else {
    SEED_DATA.budget.variaveisGroups.forEach(seedGroup=>{
      if(!b.variaveisGroups.some(g=>g.name===seedGroup.name)){
        b.variaveisGroups.push(JSON.parse(JSON.stringify(seedGroup)));
        changed = true;
      }
    });
  }
  // Corrige duplicidade: esses 5 itens são de Despesas Variáveis (grupo "Outros"), não de
  // Despesas Fixas — se ainda estiverem no "Outros" de fixaGroups (dado salvo antigo), remove de lá.
  const DUP_LABELS = ['Pais Jhonatan','Dízimo','Grancursos','Viagem/lazer','Despesas mensais pagas no PIX/débito'];
  const fixaOutros = b.fixaGroups.find(g=>g.name==='Outros');
  if(fixaOutros){
    const before = fixaOutros.items.length;
    fixaOutros.items = fixaOutros.items.filter(it=> !DUP_LABELS.includes(it.label));
    if(fixaOutros.items.length !== before) changed = true;
  }
  if(changed) saveBudget();
}
/** Se o usuário nunca preencheu dividendo/dólar (tudo zero — provável dado salvo antes
 * de eu ter pesquisado os valores reais), traz os valores pesquisados mais recentes. */
function migrateKncr11(){
  const k = state.kncr11;
  const allZero = k.dividendos.every(v=>!v) && k.dolar.every(v=>!v);
  if(allZero){
    state.kncr11 = JSON.parse(JSON.stringify(SEED_DATA.kncr11));
    saveKncr11();
  }
}

/* ============================= COMPUTATIONS ============================= */
function sumMonth(list, mi){ return list.reduce((s,i)=> s + (Number(i.values[mi])||0), 0); }
function receitaTotalMonth(mi){ return sumMonth(state.budget.receitas, mi); }
function descontoTotalMonth(mi){ return sumMonth(state.budget.descontos, mi); }
function fixaTotalMonth(mi){ return state.budget.fixaGroups.reduce((s,g)=> s + sumMonth(g.items, mi), 0); }
function variaveisGroupsTotalMonth(mi){ return (state.budget.variaveisGroups||[]).reduce((s,g)=> s + sumMonth(g.items, mi), 0); }
/** "Despesa" do Resumo do mês = Despesas Fixas + Despesas Variáveis + Total de despesas do cartão (valor cheio, sem descontar nada) */
function despesaTotalMonth(mi){ return fixaTotalMonth(mi) + variaveisGroupsTotalMonth(mi) + variavelTotalMonthSemMae(mi); }
/** Usado no Painel: soma o valor CHEIO do cartão (sem descontar recuperações) — diferente do "Despesa" do Resumo do mês no Orçamento, que usa o líquido. */
function despesaTotalMonthBruto(mi){ return fixaTotalMonth(mi) + variaveisGroupsTotalMonth(mi) + variavelTotalMonth(mi); }

function cartaoTransactionsForMonth(mi, year){
  return state.cartao.filter(t=>{
    if(!t.data) return false;
    const d = new Date(t.data+"T00:00:00");
    return d.getMonth()===mi && d.getFullYear()===year;
  });
}
function variavelGastoCategoria(mi, categoriaLabel){
  const s = prevMonthYear(mi, YEAR); // vencimento: mês M cobra a competência de M-1
  return cartaoTransactionsForMonth(s.mi, s.year).filter(t=>t.categoria===categoriaLabel).reduce((s,t)=> s+(Number(t.valor)||0),0);
}
function variavelTotalMonth(mi){
  return state.budget.variaveis.reduce((s,v)=> s + variavelGastoCategoria(mi, v.label), 0);
}
/** Recuperação de um item: só a parte do gasto da categoria vinculada acima da franquia volta de verdade. */
function recuperacaoItemMonth(mi, item){
  if(!item) return 0;
  if(item.categoria){
    const gasto = variavelGastoCategoria(mi, item.categoria);
    return Math.max(0, gasto - (Number(item.franquia)||0));
  }
  return Number((item.valoresManuais||[])[mi]) || 0;
}
/** Soma de todas as recuperações de despesa cadastradas (Mãe, ou qualquer outra fonte que você adicionar). */
function recuperacaoTotalMonth(mi){
  return (state.budget.recuperacoes||[]).reduce((s,r)=> s + recuperacaoItemMonth(mi, r), 0);
}
/** Soma cheia (sem descontar franquia) das categorias vinculadas a alguma recuperação — usado só na linha informativa "Total de despesas líquido". */
/** Soma o que deve sair do "Total de despesas líquido": valor cheio da categoria (se vinculada) ou o valor manual digitado (se não vinculada). */
function recuperacaoCategoriasFullTotal(mi){
  return (state.budget.recuperacoes||[]).reduce((s,r)=>{
    if(r.categoria) return s + variavelGastoCategoria(mi, r.categoria);
    return s + (Number((r.valoresManuais||[])[mi]) || 0);
  }, 0);
}
/** Linha informativa "Total de despesas líquido": Total do cartão sem a Mãe (reembolsável) inteira nem as demais recuperações — só pra referência, não entra no Saldo. */
function variavelTotalMonthSemMae(mi){
  return variavelTotalMonth(mi) - recuperacaoCategoriasFullTotal(mi);
}
function investTotalMonth(mi){
  return state.investimentos.filter(a=>{
    if(!a.data) return false;
    const d = new Date(a.data+"T00:00:00");
    return d.getMonth()===mi && d.getFullYear()===YEAR;
  }).reduce((s,a)=> s+(Number(a.valor)||0),0);
}
/** Saldo do mês (Orçamento) = (Receitas − Descontos) − Despesa líquida (já com as recuperações descontadas) */
function saldoMonth(mi){
  return receitaTotalMonth(mi) - descontoTotalMonth(mi) - despesaTotalMonth(mi);
}
/** Saldo do mês (Painel) = (Receitas − Descontos) − Despesa CHEIA — a mesma que já aparece no card "Despesas do mês" */
function saldoMonthBruto(mi){
  return receitaTotalMonth(mi) - descontoTotalMonth(mi) - despesaTotalMonthBruto(mi);
}
function bemValorParcela(b){ return (Number(b.valorTotal)||0) / (Number(b.parcelasTotais)||1); }
function bemSaldoDevedor(b){ return Math.max(0, bemValorParcela(b) * ((Number(b.parcelasTotais)||1) - (Number(b.parcelasPagas)||0))); }
function bensPatrimonioTotal(){ return state.bens.reduce((s,b)=> s+(Number(b.valorTotal)||0),0); }
function bensSaldoDevedorTotal(){ return state.bens.reduce((s,b)=> s+bemSaldoDevedor(b),0); }

function prevMonthYear(mi, year){
  let pm = mi-1, py = year;
  if(pm<0){ pm = 11; py = year-1; }
  return {mi:pm, year:py};
}

        <p class="donut-selected" id="donut-selected">Clique numa categoria da legenda para ver o valor exato.</p>
        <div class="chart-box"><canvas id="chart-donut"></canvas></div>
      </div>
      <div class="panel">
        <div class="panel-header"><h2>Receita, despesa e investimento — ${YEAR}</h2></div>
        <div class="chart-box"><canvas id="chart-line"></canvas></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Patrimônio em bens</h2>
        <span class="hint">Móveis e eletrodomésticos registrados</span>
      </div>
      <div class="cards-row cards-row-3" style="margin-bottom:0;">
        ${statCard('box','Total em bens', fmt(bensPatrimonioTotal()), 'ouro')}
        ${statCard('down','Ainda parcelando', fmt(bensSaldoDevedorTotal()), 'vinho')}
        ${statCard('wallet','Itens cadastrados', state.bens.length, 'azul')}
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Parcelas do cartão em ${MONTHS[mi]}</h2>
        <span class="hint">Compras de ${MONTHS[compet.mi]}${compet.year!==YEAR?'/'+compet.year:''} (competência), com vencimento em ${MONTHS[mi]}</span>

          <thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Parcela</th><th class="num">Valor</th></tr></thead>
          <tbody>
            ${openInstallments.map(t=>`
              <tr>
                <td>${dateBR(t.data)}</td>
                <td>${esc(t.categoria)}</td>
                <td>${esc(t.descricao)}</td>
                <td>${esc(t.parcela)}</td>

}

function buildDashboardCharts(){
  const mi = state.monthIndex;
  const dCtx = document.getElementById('chart-donut');
  const lCtx = document.getElementById('chart-line');
  if(!dCtx || !lCtx || typeof Chart === 'undefined') return;

  if(charts.donut) charts.donut.destroy();
  if(charts.line) charts.line.destroy();

  const varLabels = state.budget.variaveis.map(v=>v.label);
  const varData = state.budget.variaveis.map(v=>variavelGastoCategoria(mi, v.label));
  const labels = [...varLabels, 'Despesas Fixas'];
  const data = [...varData, fixaTotalMonth(mi)];
  const colors = labels.map((_,i)=> PALETTE[i % PALETTE.length]);
  donutSelectedIndex = null;

  function selectSlice(chart, idx){
    donutSelectedIndex = (donutSelectedIndex===idx) ? null : idx;
    chart.data.datasets[0].offset = colors.map((_,i)=> donutSelectedIndex===i ? 20 : 0);
    chart.data.datasets[0].backgroundColor = colors.map((c,i)=> (donutSelectedIndex===null || donutSelectedIndex===i) ? c : c+'40');
    chart.update();
    const el = document.getElementById('donut-selected');
    if(el) el.innerHTML = donutSelectedIndex===null
      ? 'Clique numa categoria da legenda para ver o valor exato.'
      : `${esc(labels[idx])}: <strong>${fmt(data[idx])}</strong>`;
  }

  charts.donut = new Chart(dCtx, {
    type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor:[...colors], offset:labels.map(()=>0), borderColor:'#FFFDF8', borderWidth:2 }] },
    options:{
      maintainAspectRatio:false,
      plugins:{
        legend:{
          position:'right',
          labels:{ boxWidth:11, font:{size:11}, color:'#5B6B7A' },
          onClick:(evt, legendItem, legend)=> selectSlice(legend.chart, legendItem.index)
        },
        tooltip:{ callbacks:{ label:(ctx)=> ` ${ctx.label}: ${fmt(ctx.raw)}` } }
      },
      onClick:(evt, elements, chart)=>{
        if(!elements.length) return;
        selectSlice(chart, elements[0].index);
      }
    }
  });

  const receitaSerie = MONTHS.map((_,i)=> receitaTotalMonth(i) - descontoTotalMonth(i));
  const despesaSerie = MONTHS.map((_,i)=> despesaTotalMonth(i));
  const investSerie = MONTHS.map((_,i)=> investTotalMonth(i));

  charts.line = new Chart(lCtx, {
    type:'line',
    data:{
      labels: MONTHS.map(m=>m.slice(0,3)),
      datasets:[
        {label:'Receita', data:receitaSerie, borderColor:'#2F6F4F', backgroundColor:'#2F6F4F', tension:.25},
        {label:'Despesa', data:despesaSerie, borderColor:'#8C3B32', backgroundColor:'#8C3B32', tension:.25},
        {label:'Investimento', data:investSerie, borderColor:'#A9812E', backgroundColor:'#A9812E', tension:.25},
      ]
    },
    options:{
      maintainAspectRatio:false,
      scales:{
        y:{ ticks:{ callback:(v)=> 'R$ '+ (v/1000).toFixed(0)+'k', color:'#5B6B7A' }, grid:{color:'#EFE9D8'} },
        x:{ ticks:{color:'#5B6B7A'}, grid:{display:false} }
      },
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:11, font:{size:11}, color:'#5B6B7A' } } }
    }
  });
}

function buildInvestimentosCharts(){
  const barCtx = document.getElementById('chart-invest-monthly');
  const kncrCtx = document.getElementById('chart-kncr11');
  if(!barCtx || !kncrCtx || typeof Chart === 'undefined') return;
  if(charts.investMonthly) charts.investMonthly.destroy();
  if(charts.kncr11) charts.kncr11.destroy();

  const monthlyTotals = MONTHS.map((_,mi)=>{
    return state.investimentos.filter(a=>{
      if(!a.data) return false;
      const d = new Date(a.data+"T00:00:00");
      return d.getMonth()===mi && d.getFullYear()===YEAR;
    }).reduce((s,a)=> s+(Number(a.valor)||0), 0);
  });
  charts.investMonthly = new Chart(barCtx, {
    type:'bar',
    data:{ labels:MONTHS.map(m=>m.slice(0,3)), datasets:[{ label:'Investido no mês', data:monthlyTotals, backgroundColor:'#C1810F', borderRadius:6, maxBarThickness:34 }] },
    options:{
      maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(ctx)=> ` ${fmt(ctx.raw)}` } } },
      scales:{
        y:{ ticks:{ callback:(v)=> 'R$ '+(v/1000).toFixed(1)+'k', color:'#5B6B7A' }, grid:{color:'#EEF0F4'} },
        x:{ ticks:{color:'#5B6B7A'}, grid:{display:false} }
      }
    }
  });

  const k = state.kncr11;
  charts.kncr11 = new Chart(kncrCtx, {
    type:'line',
    data:{
      labels: MONTHS.map(m=>m.slice(0,3)),
      datasets:[
        {label:'Valor investido (R$)', data:k.valorAtual, borderColor:'#16A34A', backgroundColor:'#16A34A15', fill:true, tension:.3, yAxisID:'y'},
        {label:'Dividendo pago (R$)', data:k.dividendos, borderColor:'#3D5AFE', backgroundColor:'#3D5AFE15', fill:true, tension:.3, yAxisID:'y1'},
      ]
    },
    options:{
      maintainAspectRatio:false,
      plugins:{
        legend:{ position:'bottom', labels:{ boxWidth:11, font:{size:11}, color:'#5B6B7A' } },
        tooltip:{
          callbacks:{
            label:(ctx)=>{
              if(ctx.datasetIndex===1){
                const pct = (k.dividendoPct||[])[ctx.dataIndex];
                return ` Dividendo: ${fmt(ctx.raw)}` + (pct!=null ? `  •  ${pct.toFixed(2)}% no mês` : '');
              }
              return ` Valor investido: ${fmt(ctx.raw)}`;
            }
          }
        }
      },
      scales:{
        y:{ position:'left', ticks:{ callback:(v)=> 'R$ '+v, color:'#16A34A' }, grid:{color:'#EEF0F4'} },
        y1:{ position:'right', ticks:{ callback:(v)=> 'R$ '+v, color:'#3D5AFE' }, grid:{display:false} },
        x:{ ticks:{color:'#5B6B7A'}, grid:{display:false} }
      },
      elements:{ point:{ radius:3, hoverRadius:6 } }
    }
  });
}

  const set = (id,val)=>{ const el=document.getElementById(id); if(el) el.textContent = fmt(val); };
  set('tot-receitas', receita); set('tot-descontos', desconto); set('tot-liquido', receita-desconto); set('tot-fixa', fixa);
  set('tot-varGroups', varGroups); set('tot-variavel', limiteTotal); set('tot-variavel-semmae', limiteTotalSemMae); set('tot-despesa', despesa); set('tot-saldo', saldo);
  const recEl = document.getElementById('tot-recuperacao-total'); if(recEl) recEl.textContent = '+'+fmt(recuperacao);
  const recCardEl = document.getElementById('tot-recuperacao-card'); if(recCardEl) recCardEl.textContent = fmt(recuperacao);
  state.budget.variaveis.forEach(v=>{
    const gasto = variavelGastoCategoria(mi, v.label);
    const limite = Number(v.limite)||0;
    const pct = limite>0 ? Math.min(100,(gasto/limite)*100) : (gasto>0?100:0);

function toggleCartaoFiltroCategoria(label){
  const allLabels = state.budget.variaveis.map(v=>v.label);
  if(label === '__TODAS__'){
    // alterna: se está tudo selecionado, desmarca tudo; senão, seleciona tudo
    state.cartaoFiltro = (state.cartaoFiltro === null) ? [] : null;
    return;
  }
  let current = state.cartaoFiltro===null ? [...allLabels] : [...state.cartaoFiltro];
  if(current.includes(label)) current = current.filter(l=>l!==label);
  else current.push(label);
  state.cartaoFiltro = (current.length === allLabels.length) ? null : current;
}

function addBemFromForm(){
  const nome = document.getElementById('f-bem-nome').value.trim();
  const categoria = document.getElementById('f-bem-categoria').value;
  const valorTotal = parseFloat(document.getElementById('f-bem-valor').value);
  const dataCompra = document.getElementById('f-bem-data').value;
  const parcelasTotais = parseInt(document.getElementById('f-bem-parcelas').value) || 1;
  const errEl = document.getElementById('bem-form-error');
  if(!nome || !valorTotal || valorTotal<=0 || !dataCompra){
    errEl.textContent = 'Preencha item, valor e data da compra.';
    return;
  }
  errEl.textContent = '';
  state.bens.push({id:uid(), nome, categoria, valorTotal, dataCompra, parcelasTotais, parcelasPagas:0, observacao:''});
  saveBens();
  renderMain();
}

/* ============================= PLANILHA (réplica editável) ============================= */
const SECTION_COLORS = {
  receitas:      {bg:'#23359b', fg:'#fff'},
  investimentos: {bg:'#93733a', fg:'#fff'},
  manutVariavel: {bg:'#23359b', fg:'#fff'},
  manutFixa:     {bg:'var(--verde)', fg:'#fff'},
  cartao:        {bg:'#8891A0', fg:'#fff'},
  saldo:         {bg:'#0a1859e0', fg:'#fff'},
};
// Chave composta "secao:nome" — evita colisão entre grupos de mesmo nome em seções diferentes (ex: "Outros" existe tanto em Manutenção Variável quanto em Manutenção Fixa)
const GROUP_COLORS = {
  'receitas:Descontos fixos na folha de pagamento': {bg:'#3e498324', fg:'var(--ink-soft)'},
  'manutVariavel:Seguros':     {bg:'#DFF5F3',   fg:'#0E7A72'},
  'manutVariavel:Obrigações':  {bg:'#FDECDF',   fg:'#B85A16'},
  'manutVariavel:Transporte':  {bg:'#E7EBFF',   fg:'#3D5AFE'},
  'manutVariavel:Impostos':    {bg:'#F5E6F8',   fg:'#9A3FA6'},
  'manutVariavel:Outros':      {bg:'#6ec1d569', fg:'#0E5F6B'},
  'manutFixa:Moradia':         {bg:'#6dab6a40', fg:'#2F6B2C'},
  'manutFixa:Outros':          {bg:'#6dab6a40', fg:'#2F6B2C'},
};
const INVEST_VISIBLE_LABELS = ['CDB longo prazo PREV - MP','CDB Reserva de emergência - MP','Poupança Casa Própria','Dólar'];

function getVisibleMonthIndices(){
  const n = state.planilhaMonthView === 6 ? 6 : 12;
  return Array.from({length:n}, (_,i)=>i);
}
function monthViewToggleHTML(){
  const v = state.planilhaMonthView;
  return `
    <div class="subtab-switch">
      <button type="button" class="subtab-btn ${v===6?'active':''}" data-action="planilha-months" data-months="6">6 meses</button>
      <button type="button" class="subtab-btn ${v===12?'active':''}" data-action="planilha-months" data-months="12">12 meses</button>
    </div>
  `;
}
function sheetSectionHeader(name, colorKey){
  const cols = getVisibleMonthIndices().length + 2;
  const c = colorKey && SECTION_COLORS[colorKey];
  const style = c ? ` style="background:${c.bg};color:${c.fg};"` : '';
  return `<tr class="sheet-section-row"><td${style} colspan="${cols}"><span class="sheet-band-label">${esc(name)}</span></td></tr>`;
}
function sheetGroupHeader(name, colorKey){
  const cols = getVisibleMonthIndices().length + 2;
  const c = colorKey && GROUP_COLORS[colorKey];
  const style = c ? ` style="background:${c.bg};color:${c.fg};"` : '';
  return `<tr class="sheet-group-row"><td${style} colspan="${cols}"><span class="sheet-band-label">${esc(name)}</span></td></tr>`;
}
function sheetSpacerRow(){
  const cols = getVisibleMonthIndices().length + 2;
  return `<tr class="sheet-spacer-row"><td colspan="${cols}"></td></tr>`;
}
function sheetNoteRow(text){
  const cols = getVisibleMonthIndices().length + 2;
  return `<tr class="sheet-note-row"><td colspan="${cols}">${esc(text)}</td></tr>`;
}
/** Linha somente-leitura (valor calculado automaticamente, não editável) */
function planilhaComputedRow(item, monthlyValues, extra){
  extra = extra || {};
  const VM = getVisibleMonthIndices();
  const annualTotal = monthlyValues.reduce((a,b)=>a+b,0);
  const navLink = extra.navTab ? `<button type="button" class="sheet-nav-link" data-action="go-to-tab" data-tab="${extra.navTab}">${icon('up',11)} ver no Cartão</button>` : '';
  return `<tr>
    <td class="sheet-sticky">
      <div class="sheet-label-input" contenteditable="true" spellcheck="false" data-planilha-field="label" data-psection="cartao" data-id="${item.id}">${esc(item.label)}</div>
      ${navLink}
    </td>
    ${VM.map(mi=>`<td class="num">${fmt(monthlyValues[mi])}</td>`).join('')}
    <td class="num">${fmt(annualTotal)}</td>
  </tr>`;
}
function sheetTotalRow(label, monthlyValues, annualValue){
  const VM = getVisibleMonthIndices();
  return `<tr class="sheet-total-row"><td class="sheet-sticky">${esc(label)}</td>${VM.map(mi=>`<td class="num">${fmt(monthlyValues[mi])}</td>`).join('')}<td class="num">${annualValue===null?'—':fmt(annualValue)}</td></tr>`;
}
function sheetPctRow(label, monthlyRatios){
  const VM = getVisibleMonthIndices();
  return `<tr class="sheet-pct-row"><td class="sheet-sticky">${esc(label)}</td>${VM.map(mi=>{ const r=monthlyRatios[mi]; return `<td class="num">${isFinite(r)&&r!==0?(r*100).toFixed(1)+'%':'—'}</td>`; }).join('')}<td class="num"></td></tr>`;
}
function sheetSaldoRow(label, monthlyValues, annualValue, variant){
  const VM = getVisibleMonthIndices();
  return `<tr class="sheet-saldo-row sheet-saldo-${variant}"><td class="sheet-sticky">${esc(label)}</td>${VM.map(mi=>`<td class="num">${fmt(monthlyValues[mi])}</td>`).join('')}<td class="num">${fmt(annualValue)}</td></tr>`;
}
function planilhaRow(item, psection, extra){
  extra = extra || {};
  const groupAttr = extra.groupId ? ` data-group-id="${extra.groupId}"` : '';
  const annualTotal = item.values.reduce((a,b)=>a+(Number(b)||0),0);
  const VM = getVisibleMonthIndices();
  const navLink = extra.navTab ? `<button type="button" class="sheet-nav-link" data-action="go-to-tab" data-tab="${extra.navTab}">${icon('up',11)} ver no Cartão</button>` : '';
  return `<tr>
    <td class="sheet-sticky">
      <div class="sheet-label-input" contenteditable="true" spellcheck="false" data-planilha-field="label" data-psection="${psection}"${groupAttr} data-id="${item.id}">${esc(item.label)}</div>
      ${navLink}
    </td>
    ${VM.map(mi=>{
      const v = item.values[mi];
      const colorStyle = extra.greenIfPositive && v>0 ? ' style="color:var(--verde);font-weight:600;"' : '';
      return `<td class="num"><input class="sheet-input" type="text" inputmode="decimal" placeholder="0,00"${colorStyle} data-planilha-field="value" data-psection="${psection}"${groupAttr} data-id="${item.id}" data-mi="${mi}" value="${sheetFmt(v)}"></td>`;
    }).join('')}
    <td class="num">${fmt(annualTotal)}</td>
  </tr>`;
}
function planilhaSum(items, mi){ return items.reduce((s,it)=> s+(Number(it.values[mi])||0), 0); }
function planilhaGroupsSum(groups, mi){ return groups.reduce((s,g)=> s+planilhaSum(g.items, mi), 0); }
function planilhaAnnualSum(arr){ return arr.reduce((a,b)=>a+b,0); }

function planilhaMainTableHTML(){
  const p = state.planilha;
  const b = state.budget; // fonte única, compartilhada com a aba Orçamento
  const M = [...Array(12).keys()];

  const receitaTotals = M.map(mi=> planilhaSum(b.receitas, mi));
  const descontoTotals = M.map(mi=> planilhaSum(b.descontos, mi)); // armazenado positivo (mesma convenção do Orçamento)
  const netTotals = M.map(mi=> receitaTotals[mi]-descontoTotals[mi]);

  const investVisible = p.investimentos.filter(it=> INVEST_VISIBLE_LABELS.includes(it.label));
  const investTotals = M.map(mi=> p.investimentos.reduce((s,it)=> it.countsInTotal===false ? s : s+(Number(it.values[mi])||0), 0));
  const pct = (num,den)=> den!==0 ? num/den : 0;
  const investPct = M.map(mi=> pct(investTotals[mi], netTotals[mi]));

  const manutVarTotals = M.map(mi=> planilhaGroupsSum(b.variaveisGroups, mi));
  const manutVarPct = M.map(mi=> pct(manutVarTotals[mi], netTotals[mi]));

  const manutFixaTotals = M.map(mi=> planilhaGroupsSum(b.fixaGroups, mi));
  const manutFixaPct = M.map(mi=> pct(manutFixaTotals[mi], netTotals[mi]));

  // Cartão de Crédito na Planilha usa o mesmo cálculo do Orçamento/Painel:
  // valor cheio (por vencimento, mês anterior) menos as recuperações de despesa cadastradas.
  const cartaoXPValues = M.map(mi=> variavelTotalMonth(mi));
  const recuperacaoRowValues = M.map(mi=> -recuperacaoCategoriasFullTotal(mi));
  const cartaoTotals = M.map(mi=> variavelTotalMonthSemMae(mi)); // Total de despesas líquido
  const cartaoPct = M.map(mi=> pct(cartaoTotals[mi], netTotals[mi]));

  const gastoMensalTotals = M.map(mi=> manutVarTotals[mi]+manutFixaTotals[mi]+cartaoTotals[mi]);
  const totalSaldoDoMes = M.map(mi=> netTotals[mi]-manutVarTotals[mi]-manutFixaTotals[mi]-cartaoTotals[mi]-investTotals[mi]);

  return `
    <div class="panel">
      <div class="panel-header">
        <h2>Planilha Orçamentária ${YEAR}</h2>
        ${monthViewToggleHTML()}
      </div>
      <p class="hint" style="margin:-8px 0 14px;">🔗 Receitas, Descontos, Manutenção Variável e Manutenção Fixa são os <strong>mesmos dados</strong> da aba Orçamento — editar aqui ou lá atualiza os dois.</p>
      <div class="sheet-scroll">
        <table class="sheet-table ${state.planilhaStyle==='classico'?'sheet-classic':''}">
          <thead>
            <tr>
              <th class="sheet-sticky">Item</th>
              ${getVisibleMonthIndices().map(mi=>`<th class="num">${MONTHS[mi].slice(0,3)}</th>`).join('')}
              <th class="num">Total anual</th>
            </tr>
          </thead>
          <tbody>
            ${sheetSectionHeader('Receitas', 'receitas')}
            ${b.receitas.map(it=>planilhaRow(it,'receitas', {greenIfPositive: it.label.toLowerCase().includes('restante')})).join('')}
            ${sheetGroupHeader('Descontos fixos na folha de pagamento', 'receitas:Descontos fixos na folha de pagamento')}
            ${b.descontos.map(it=>planilhaRow(it,'descontos')).join('')}
            ${sheetTotalRow('Total (receitas − descontos)', netTotals, planilhaAnnualSum(netTotals))}
            ${sheetSpacerRow()}

            ${sheetSectionHeader('Investimentos', 'investimentos')}
            ${investVisible.map(it=>planilhaRow(it,'investimentos')).join('')}
            ${sheetTotalRow('Total investimentos', investTotals, planilhaAnnualSum(investTotals))}
            ${sheetPctRow('% sobre a receita', investPct)}
            ${sheetSpacerRow()}

            ${sheetSectionHeader('Manutenção variável', 'manutVariavel')}
            ${b.variaveisGroups.map(g=> sheetGroupHeader(g.name, 'manutVariavel:'+g.name) + g.items.map(it=>planilhaRow(it,'manutVariavel',{groupId:g.id})).join('')).join('')}
            ${sheetTotalRow('Total manutenção variável', manutVarTotals, planilhaAnnualSum(manutVarTotals))}
            ${sheetPctRow('% sobre a receita', manutVarPct)}
            ${sheetSpacerRow()}

            ${sheetSectionHeader('Manutenção fixa', 'manutFixa')}
            ${b.fixaGroups.map(g=> sheetGroupHeader(g.name, 'manutFixa:'+g.name) + g.items.map(it=>planilhaRow(it,'manutFixa',{groupId:g.id})).join('')).join('')}
            ${sheetTotalRow('Total manutenção fixa', manutFixaTotals, planilhaAnnualSum(manutFixaTotals))}
            ${sheetPctRow('% sobre a receita', manutFixaPct)}
            ${sheetSpacerRow()}

            ${sheetSectionHeader('Cartão de crédito', 'cartao')}
            ${sheetNoteRow('🔗 Total de despesas líquido: valor do cartão do mês anterior já descontando as recuperações de despesa cadastradas no Orçamento.')}
            ${planilhaComputedRow(p.cartao[0], cartaoXPValues)}
            ${planilhaComputedRow(p.cartao[1], recuperacaoRowValues, {navTab:'cartao'})}
            ${sheetTotalRow('Total cartão de crédito', cartaoTotals, planilhaAnnualSum(cartaoTotals))}
            ${sheetPctRow('% sobre a receita', cartaoPct)}
            ${sheetSpacerRow()}

            ${sheetSectionHeader('Saldo', 'saldo')}
            ${sheetSaldoRow('Receitas', netTotals, planilhaAnnualSum(netTotals), 'even')}
            ${sheetSaldoRow('Investimentos', investTotals, planilhaAnnualSum(investTotals), 'odd')}
            ${sheetSaldoRow('Manutenção variável', manutVarTotals, planilhaAnnualSum(manutVarTotals), 'even')}
            ${sheetSaldoRow('Manutenção fixa', manutFixaTotals, planilhaAnnualSum(manutFixaTotals), 'odd')}
            ${sheetSaldoRow('Cartão de crédito', cartaoTotals, planilhaAnnualSum(cartaoTotals), 'even')}
            ${sheetSaldoRow('Gasto mensal', gastoMensalTotals, planilhaAnnualSum(gastoMensalTotals), 'odd')}
            ${sheetSaldoRow('Total saldo do mês', totalSaldoDoMes, planilhaAnnualSum(totalSaldoDoMes), 'final')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function planilhaHTML(){
  const style = state.planilhaStyle;
  const switcherHTML = `
    <div class="subtab-switch">
      <button type="button" class="subtab-btn ${style==='moderno'?'active':''}" data-action="planilha-style" data-style="moderno">${icon('grid',15)} Moderno</button>
      <button type="button" class="subtab-btn ${style==='classico'?'active':''}" data-action="planilha-style" data-style="classico">${icon('sheet',15)} Clássico (planilha)</button>
    </div>
  `;
  const bodyHTML = planilhaMainTableHTML() + planilhaLimiteHTML();
  return switcherHTML + (style==='classico' ? `<div class="planilha-classic">${bodyHTML}</div>` : bodyHTML);
}

function updatePlanilhaField(el){
  const field = el.dataset.planilhaField;
  const psection = el.dataset.psection;
  const id = el.dataset.id;
  const groupId = el.dataset.groupId;
  const mi = el.dataset.mi!==undefined ? parseInt(el.dataset.mi,10) : null;
  const p = state.planilha;
  const b = state.budget;
  const findItem = list => list.find(i=>i.id===id);

  let item = null, target = 'planilha';
  if(psection==='receitas'){ item = findItem(b.receitas); target='budget'; }
  else if(psection==='descontos'){ item = findItem(b.descontos); target='budget'; }
  else if(psection==='investimentos') item = findItem(p.investimentos);
  else if(psection==='cartao') item = findItem(p.cartao);
  else if(psection==='manutVariavel'){ const g=b.variaveisGroups.find(g=>g.id===groupId); item = g ? findItem(g.items) : null; target='budget'; }
  else if(psection==='manutFixa'){ const g=b.fixaGroups.find(g=>g.id===groupId); item = g ? findItem(g.items) : null; target='budget'; }
  else if(psection==='limite'){ item = b.variaveis.find(v=>v.id===id); target='budget'; }
  if(!item) return;
  const raw = el.isContentEditable ? el.textContent.trim() : el.value;

  if(field==='label') item.label = raw;
  else if(field==='limite') item.limite = sheetParse(el.value);
  else if(field==='value' && mi!==null) item.values[mi] = sheetParse(el.value);

  if(target==='budget') saveBudget(); else savePlanilha();
}

/* ============================= MAIN RENDER ============================= */
function renderMain(){
  const root = document.getElementById('main-content');
  if(state.activeTab==='dashboard') root.innerHTML = dashboardHTML();
  else if(state.activeTab==='orcamento') root.innerHTML = orcamentoHTML();
  else if(state.activeTab==='cartao') root.innerHTML = cartaoHTML();
  else if(state.activeTab==='investimentos') root.innerHTML = investimentosHTML();
  else if(state.activeTab==='bens') root.innerHTML = bensHTML();
  else if(state.activeTab==='planilha') root.innerHTML = planilhaHTML();
  root.classList.toggle('wide', state.activeTab==='planilha' || (state.activeTab==='cartao' && state.cartaoSubTab==='visaogeral'));
  renderSidebar();
  renderTopbar();
  if(state.activeTab==='dashboard') buildDashboardCharts();
  if(state.activeTab==='investimentos') buildInvestimentosCharts();
}

/* ============================= ACTIONS ============================= */
function prevMonth(){ state.monthIndex = (state.monthIndex+11)%12; renderMain(); }
function nextMonth(){ state.monthIndex = (state.monthIndex+1)%12; renderMain(); }
async function refreshData(){
  const btn = document.querySelector('[data-action="refresh-data"]');
  if(btn) btn.textContent = '🔄 Atualizando…';
  await loadAll();
  renderMain();
}

function handleClick(e){
  const tabEl = e.target.closest('[data-tab]');
  if(tabEl){ state.activeTab = tabEl.dataset.tab; renderMain(); return; }

  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  const groupId = btn.dataset.groupId;
  const label = btn.dataset.label;

  switch(action){
    case 'prev-month': prevMonth(); break;
    case 'next-month': nextMonth(); break;
    case 'refresh-data': refreshData(); break;
    case 'reset-data': resetToBlank(); break;
    case 'modal-cancel': closeConfirm(); break;
    case 'modal-noop': break;
    case 'modal-confirm': {
      const cb = state.confirmModal && state.confirmModal.onConfirm;
      closeConfirm();
      if(cb) cb();
      break;
    }
    case 'toggle-cartao-filtro': toggleCartaoFiltroCategoria(label); renderMain(); break;
    case 'cartao-subtab': state.cartaoSubTab = btn.dataset.sub; renderMain(); break;
    case 'planilha-months': state.planilhaMonthView = parseInt(btn.dataset.months,10); renderMain(); break;
    case 'planilha-style': state.planilhaStyle = btn.dataset.style; renderMain(); break;
    case 'go-to-tab': state.activeTab = btn.dataset.tab; renderMain(); break;
    case 'print-cartao': window.print(); break;
    case 'add-cartaolimite': addCartaoLimiteFromForm(); break;
    case 'del-cartaolimite': state.cartoes = (state.cartoes||[]).filter(c=>c.id!==id); saveCartoes(); renderMain(); break;
    case 'go-to-month': state.monthIndex = parseInt(btn.dataset.mi,10); state.cartaoSubTab='lancamentos'; renderMain(); break;
    case 'toggle-visaogeral-cat': {
      const lbl = btn.dataset.label;
      const cur = state.visaoGeralExcluded || [];
      state.visaoGeralExcluded = cur.includes(lbl) ? cur.filter(l=>l!==lbl) : [...cur, lbl];
      renderMain();
      break;
    }

    case 'add-receita': state.budget.receitas.push(newRow()); saveBudget(); renderMain(); break;
    case 'remove-receita': state.budget.receitas = state.budget.receitas.filter(r=>r.id!==id); saveBudget(); renderMain(); break;
    case 'add-desconto': state.budget.descontos.push(newRow()); saveBudget(); renderMain(); break;
    case 'remove-desconto': state.budget.descontos = state.budget.descontos.filter(r=>r.id!==id); saveBudget(); renderMain(); break;

    case 'add-fixa-group': state.budget.fixaGroups.push({id:uid(), name:'Novo grupo', items:[]}); saveBudget(); renderMain(); break;
    case 'remove-fixa-group': state.budget.fixaGroups = state.budget.fixaGroups.filter(g=>g.id!==groupId); saveBudget(); renderMain(); break;
    case 'add-fixa-item': { const g=state.budget.fixaGroups.find(g=>g.id===groupId); if(g) g.items.push(newRow()); saveBudget(); renderMain(); break; }
    case 'remove-fixa-item': { const g=state.budget.fixaGroups.find(g=>g.id===groupId); if(g) g.items=g.items.filter(i=>i.id!==id); saveBudget(); renderMain(); break; }
    case 'add-varGroup-group': (state.budget.variaveisGroups=state.budget.variaveisGroups||[]).push({id:uid(), name:'Novo grupo', items:[]}); saveBudget(); renderMain(); break;
    case 'remove-varGroup-group': state.budget.variaveisGroups = (state.budget.variaveisGroups||[]).filter(g=>g.id!==groupId); saveBudget(); renderMain(); break;
    case 'add-varGroup-item': { const g=(state.budget.variaveisGroups||[]).find(g=>g.id===groupId); if(g) g.items.push(newRow()); saveBudget(); renderMain(); break; }
    case 'remove-varGroup-item': { const g=(state.budget.variaveisGroups||[]).find(g=>g.id===groupId); if(g) g.items=g.items.filter(i=>i.id!==id); saveBudget(); renderMain(); break; }

    case 'add-variavel': state.budget.variaveis.push({id:uid(), label:'Nova categoria', limite:0}); saveBudget(); renderMain(); break;
    case 'add-recuperacao': (state.budget.recuperacoes=state.budget.recuperacoes||[]).push({id:uid(), nome:'Nova recuperação', categoria:'', franquia:0, valoresManuais:new Array(12).fill(0)}); saveBudget(); renderMain(); break;
    case 'remove-recuperacao': state.budget.recuperacoes = (state.budget.recuperacoes||[]).filter(r=>r.id!==id); saveBudget(); renderMain(); break;
    case 'remove-variavel': state.budget.variaveis = state.budget.variaveis.filter(v=>v.id!==id); saveBudget(); renderMain(); break;

    case 'add-cartao': addCartaoFromForm(); break;
    case 'del-cartao': state.cartao = state.cartao.filter(t=>t.id!==id); saveCartao(); renderMain(); break;

    case 'add-invest': addInvestFromForm(); break;
    case 'del-invest': state.investimentos = state.investimentos.filter(a=>a.id!==id); saveInvest(); renderMain(); break;

    case 'add-bem': addBemFromForm(); break;
    case 'del-bem': state.bens = state.bens.filter(b=>b.id!==id); saveBens(); renderMain(); break;
    case 'inc-parcela-bem': { const b=state.bens.find(b=>b.id===id); if(b && (b.parcelasPagas||0)<(b.parcelasTotais||1)){ b.parcelasPagas=(b.parcelasPagas||0)+1; saveBens(); renderMain(); } break; }
  }
}

function handleInput(e){
  const el = e.target;
  if(el.dataset.recupField){
    const item = (state.budget.recuperacoes||[]).find(r=>r.id===el.dataset.recupId);
    if(item){
      const field = el.dataset.recupField;
      if(field==='nome') item.nome = el.value;
      else if(field==='categoria') item.categoria = el.value;
      else if(field==='franquia') item.franquia = parseFloat(el.value)||0;
      else if(field==='valorManual'){
        if(!item.valoresManuais) item.valoresManuais = new Array(12).fill(0);
        item.valoresManuais[state.monthIndex] = parseFloat(el.value)||0;
      }
      saveBudget();
      if(e.type==='change') renderMain(); else refreshOrcamentoTotals();
    }
    return;
  }
  if(el.dataset.kncr11Field){
    const field = el.dataset.kncr11Field;
    const mi = parseInt(el.dataset.mi,10);
    state.kncr11[field][mi] = sheetParse(el.value);
    saveKncr11();
    if(e.type==='change'){ buildInvestimentosCharts(); }
    return;
  }
  if(el.dataset.planilhaField){
    updatePlanilhaField(el);
    if(e.type==='change') renderMain();
    return;
  }
  const section = el.dataset.section;
  if(!section) return;
  const mi = state.monthIndex;

  if(section==='receita' || section==='desconto'){
    const list = section==='receita' ? state.budget.receitas : state.budget.descontos;
    const item = list.find(i=>i.id===el.dataset.id);
    if(!item) return;
    if(el.dataset.field==='label') item.label = el.value; else item.values[mi] = parseFloat(el.value)||0;
    saveBudget(); refreshOrcamentoTotals();
  } else if(section==='fixa-item'){
    const g = state.budget.fixaGroups.find(g=>g.id===el.dataset.groupId);
    if(!g) return;
    const item = g.items.find(i=>i.id===el.dataset.id);
    if(!item) return;
    if(el.dataset.field==='label') item.label = el.value; else item.values[mi] = parseFloat(el.value)||0;
    saveBudget(); refreshOrcamentoTotals();
  } else if(section==='fixa-group-name'){
    const g = state.budget.fixaGroups.find(g=>g.id===el.dataset.groupId);
    if(g){ g.name = el.value; saveBudget(); }
  } else if(section==='varGroup-item'){
    const g = (state.budget.variaveisGroups||[]).find(g=>g.id===el.dataset.groupId);
    if(!g) return;
    const item = g.items.find(i=>i.id===el.dataset.id);
    if(!item) return;
    if(el.dataset.field==='label') item.label = el.value; else item.values[mi] = parseFloat(el.value)||0;
    saveBudget(); refreshOrcamentoTotals();
  } else if(section==='varGroup-group-name'){
    const g = (state.budget.variaveisGroups||[]).find(g=>g.id===el.dataset.groupId);
    if(g){ g.name = el.value; saveBudget(); }
  } else if(section==='variavel'){
    const item = state.budget.variaveis.find(i=>i.id===el.dataset.id);
    if(!item) return;
    if(el.dataset.field==='label') item.label = el.value; else item.limite = parseFloat(el.value)||0;
    saveBudget(); refreshOrcamentoTotals();
  }
}

/* ============================= INIT ============================= */
function setupDelegation(){
  document.getElementById('sidebar').addEventListener('click', handleClick);
  document.getElementById('content-area').addEventListener('click', handleClick);
  document.getElementById('content-area').addEventListener('input', handleInput);
  document.getElementById('content-area').addEventListener('change', handleInput);
  document.getElementById('modal-root').addEventListener('click', handleClick);
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && state.confirmModal) closeConfirm(); });
}
async function init(){
  renderSidebar();
  setupDelegation();
  document.getElementById('main-content').innerHTML = `<div class="empty-state">Carregando dados…</div>`;
  await loadAll();
  renderMain();
}
init();
</script>
</body>
</html>
